[package]
name = "thermo_raw_wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Browser (wasm-bindgen) wrapper around OpenTFRaw for the MS File Converter tool."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
opentfraw = "=3.0.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# OpenTFRaw 3.0.0 vendored with a small patch (keep raw scan-event bodies for activation decoding); see vendor/opentfraw/PATCH.md.
[patch.crates-io]
opentfraw = { path = "vendor/opentfraw" }
